[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.pylint.format]
max-line-length = 100

# Only read by flake8 if the Flake8-pyproject plugin is installed; otherwise
# pass --max-line-length=100 on the command line.
[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "E265"]
