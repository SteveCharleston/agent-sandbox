[project]
name = "agent-sandbox"
version = "1.0.0"
description = "Run AI agents and other programs in a bubblewrap sandbox with reviewable, jailed writes."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.scripts]
agent-sandbox = "agent_sandbox.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "flake8>=7.5.0",
    "isort>=9.0.2",
    "mypy>=2.4.1",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
]

[tool.black]
line-length = 99
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 99
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pylint.main]
py-version = "3.11"

[tool.pylint.format]
max-line-length = 99

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "integration: needs bwrap/fuse-overlayfs and user namespaces; skipped if unavailable",
]
